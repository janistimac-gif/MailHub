<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MailHub</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand"><span class="logo">✉</span><span>MailHub</span></div>
        <button class="btn primary block" id="btn-compose">＋ Novo sporočilo</button>
        <div class="side-scroll">
          <div class="side-title">Računi</div>
          <nav id="accounts-nav"></nav>
          <div class="side-title">Mape</div>
          <nav id="folders-nav"></nav>
          <div id="labels-block">
            <div class="side-title">Oznake</div>
            <nav id="labels-nav"></nav>
          </div>
        </div>
        <div class="side-footer">
          <button class="btn ghost block" id="btn-sync">⟳ Osveži vse</button>
          <button class="btn ghost block" id="btn-settings">⚙ Nastavitve</button>
        </div>
      </aside>

      <main>
        <header id="topbar">
          <input id="search" type="search" placeholder="Iskanje po vseh računih (npr. from:ana, has:attachment)…" />
          <span id="status"></span>
        </header>
        <div id="panes">
          <section id="list-pane">
            <div id="list-header"></div>
            <div id="message-list"></div>
            <div id="list-footer"></div>
          </section>
          <section id="reader-pane">
            <div class="placeholder">
              <div class="ph-icon">✉</div>
              <p>Izberite sporočilo za branje</p>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </body>
</html>
