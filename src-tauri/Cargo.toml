[package]
name = "mailhub"
version = "0.1.0"
description = "MailHub - vec Gmail racunov v enem zdruzenem nabiralniku"
authors = ["JBJ"]
edition = "2021"

[lib]
name = "mailhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
auto-launch = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
url = "2"
anyhow = "1"
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
